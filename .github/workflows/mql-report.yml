name: MQL source report

on: [push]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Your existing steps (e.g., Validate MQL sources, Send report)
      # ...

      - name: Calculate Total Duration Across All Runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mql-report.yml',
              status: 'success'
            });
            
            let totalSeconds = 0;
            runs.data.workflow_runs.forEach(run => {
              const duration = (new Date(run.updated_at) - new Date(run.run_started_at)) / 1000;
              totalSeconds += duration;
            });
            
            console.log(`Total duration across all recorded runs: ${totalSeconds} seconds`);
