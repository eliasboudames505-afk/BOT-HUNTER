name: MQL source report

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Validate MQL sources
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.validation.outcome }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate MQL source files
        id: validation
        run: python scripts/validate_mql.py

      - name: Publish validation summary
        if: always()
        run: cat reports/mql-validation.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mql-validation-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 30

  report:
    name: Send report
    if: always()
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - name: Publish scheduled status issue
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- mql-validation-status -->';
            const title = 'MQL validation status';
            const body = `${marker}
            **Status:** ${process.env.AUDIT_RESULT}
            **Run:** ${process.env.RUN_URL}
            **Commit:** ${context.sha}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation,mql-report',
              per_page: 100,
            });
            const existing = issues.find(issue => issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
                labels: ['automation', 'mql-report'],
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['automation', 'mql-report'],
              });
            }

      - name: Notify report webhook
        if: env.REPORT_WEBHOOK_URL != ''
        env:
          REPORT_WEBHOOK_URL: ${{ secrets.REPORT_WEBHOOK_URL }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Content-Type: application/json" \
            --data "{\"text\":\"BOT-HUNTER MQL validation: ${AUDIT_RESULT}\n${RUN_URL}\"}" \
            "$REPORT_WEBHOOK_URL"
